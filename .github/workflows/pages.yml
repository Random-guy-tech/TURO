name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.availability.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check whether Pages is enabled
        id: availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pages`, {
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
            }
          });
          if (response.status === 404) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'enabled=false\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              'Pages is not enabled yet. In repository Settings > Pages, choose GitHub Actions, then run this workflow again. A private repository requires an eligible GitHub plan.\n');
            console.log('Pages is not enabled. Publishing skipped.');
          } else {
            if (!response.ok) throw new Error(`Could not check Pages settings (HTTP ${response.status}).`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'enabled=true\n');
          }
          NODE
      - name: Configure Pages
        if: steps.availability.outputs.enabled == 'true'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and check the public website
        if: steps.availability.outputs.enabled == 'true'
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.base_url }}
        run: npm run build
      - name: Upload the public website
        if: steps.availability.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
